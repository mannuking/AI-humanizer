[project]
name = "humanizer"
version = "2.0.0"
description = "Rewrite AI-assisted text so it reads as genuinely human-written, with pattern detection, statistical scoring and a verification loop."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jai kumar Meena" }]
keywords = ["writing", "editing", "llm", "minimax", "streamlit", "style"]

dependencies = [
    "streamlit>=1.40.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
humanize = "humanizer.cli:main"

[project.urls]
Homepage = "https://github.com/mannuking/AI-humanizer"
Repository = "https://github.com/mannuking/AI-humanizer"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/humanizer"]

[tool.hatch.build.targets.sdist]
include = ["src/humanizer", "scripts", "tests", "docs", "README.md", "LICENSE"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: marks tests that call the network",
]

[tool.coverage.run]
source = ["src/humanizer"]
